name: Verify

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: verify-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  correctness:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-26.04, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-java@d1374f8ac7447420d16ef8ecee22c7ae7a51880 # v6.3.0
        with:
          distribution: temurin
          java-version: '27'
      - uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1
      - name: Install PostgreSQL 19 on Linux
        if: runner.os == 'Linux'
        run: |
          sudo install -d /usr/share/postgresql-common/pgdg
          curl --fail --retry 3 --retry-all-errors --connect-timeout 15 --max-time 60 --silent --show-error https://www.postgresql.org/media/keys/ACCC4CF8.asc -o /tmp/pgdg.asc
          sudo install -m 644 /tmp/pgdg.asc /usr/share/postgresql-common/pgdg/apt.postgresql.org.asc
          echo 'deb [signed-by=/usr/share/postgresql-common/pgdg/apt.postgresql.org.asc] https://apt.postgresql.org/pub/repos/apt resolute-pgdg main' | sudo tee /etc/apt/sources.list.d/pgdg.list
          sudo apt-get update
          sudo apt-get install -y postgresql-19
          echo '/usr/lib/postgresql/19/bin' >> "$GITHUB_PATH"
      - name: Install PostgreSQL 19 on macOS
        if: runner.os == 'macOS'
        run: |
          brew update
          brew install postgresql@19
          echo "$(brew --prefix postgresql@19)/bin" >> "$GITHUB_PATH"
      - name: Verify toolchains
        run: |
          java -version
          postgres --version
      - name: Build, test against PostgreSQL 19, and assemble release bundle
        run: ./gradlew clean check releaseBundle --console=plain
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: test-results-${{ runner.os }}
          path: |
            **/build/test-results/**
            **/build/reports/tests/**
            build/distributions/*.zip
          retention-days: 7
